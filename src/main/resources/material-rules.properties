# How a character in an encoded grid is decoded into a material.
#
# Rules are evaluated top to bottom and the FIRST match wins, so the order is
# part of the meaning: 65 ('A') is divisible by 13 and is a flag, while 70
# ('F') is divisible by 5 and is a sail. Swapping two entries silently
# repaints the picture, which is exactly why the order lives here, named, and
# not in an if/else chain.
#
# A predicate is either a positive integer N, meaning "code point divisible by
# N", or the word "odd" or "even".
rules = 13:FLAG, 5:SAIL, 3:HULL, odd:MAST
default = WATER
